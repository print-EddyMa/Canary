[project]
name = "canary"
version = "0.1.0"
description = "Canary: an intensive-care monitor for planet Earth, built on NASA data"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "numba>=0.60",
    "pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pymannkendall>=1.4.3",
]
# Only needed to recompute the global trend maps (python -m canary.globalmap).
maps = [
    "xarray>=2024.1",
    "zarr>=2.17",
    "s3fs>=2024.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["canary*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: test calls a live external API"]
